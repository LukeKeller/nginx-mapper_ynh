location __PATH__/ {

    # Single-page dashboard: every request is handled by index.php. There are
    # no static assets (Leaflet is loaded from a CDN), so no try_files games.
    fastcgi_pass unix:/var/run/php/php__PHPVERSION__-fpm-__APP__.sock;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME __INSTALL_DIR__/index.php;
    fastcgi_param SCRIPT_NAME __PATH__/index.php;
    fastcgi_param REMOTE_USER $remote_user;

    # Reading and decompressing a fresh GeoIP DB can take a little while.
    fastcgi_read_timeout 300;

    # Include SSOWAT user panel. Access is gated by the 'admins' permission,
    # so SSOwat forces login before this page is ever reached.
    include conf.d/yunohost_panel.conf.inc;
}
