; Allow PHP to read its own files, every site's nginx access logs (to map them),
; the data dir (where the GeoIP database is stored / refreshed), and tmp.
php_admin_value[open_basedir] = __INSTALL_DIR__/:__DATA_DIR__/:/var/log/nginx/:/tmp/:/var/tmp/

; Refreshing the GeoIP DB streams a download then decompresses it; give it room.
php_admin_value[max_execution_time] = 300
php_admin_value[memory_limit] = 128M
